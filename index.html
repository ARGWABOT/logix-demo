<div class="app">

  <!-- ============ barra lateral ============ -->
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">QW</div>
      <div class="brand-txt">
        <b>Quattro Way</b>
        <span data-i18n="brand.tag">Equipment Operations</span>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="side-foot">
      <div class="langsw" id="langsw">
        <svg class="ic"><use href="#i-globe"/></svg>
        <button type="button" data-lang="en" class="on">EN</button>
        <button type="button" data-lang="es">ES</button>
        <button type="button" data-lang="pt">PT</button>
      </div>
      <div class="whoami">
        <div class="ava">MR</div>
        <div>
          <b>M. Reyes</b>
          <span data-i18n="role.manager">Operations Manager</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- ============ zona principal ============ -->
  <main class="main">
    <header class="top">
      <div class="top-l">
        <h1 id="screen-title">Dashboard</h1>
        <span class="pill" id="screen-sub"></span>
      </div>
      <div class="top-r">
        <label class="search">
          <svg class="ic"><use href="#i-search"/></svg>
          <input type="search" id="q" data-i18n-ph="ui.search" placeholder="Search assets, people, campaigns…">
        </label>
        <button class="btn-play" id="btn-tour">
          <svg class="ic"><use href="#i-play"/></svg>
          <span data-i18n="ui.tour">Guided tour</span>
        </button>
      </div>
    </header>

    <div class="view" id="view"></div>
  </main>
</div>

<!-- ============ capa de explicación animada ============ -->
<div class="xp" id="xp" hidden>
  <div class="xp-box" role="dialog" aria-modal="true">
    <button class="xp-close" id="xp-close" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
    <div class="xp-head">
      <span class="xp-kicker" data-i18n="ui.whatHappens">What happens when you do this</span>
      <h2 id="xp-title"></h2>
    </div>
    <ol class="xp-steps" id="xp-steps"></ol>
    <div class="xp-result" id="xp-result"></div>
    <div class="xp-foot">
      <span class="xp-note" id="xp-note"></span>
      <button class="btn ghost" id="xp-replay" data-i18n="ui.replay">Replay</button>
      <button class="btn" id="xp-ok" data-i18n="ui.gotIt">Got it</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="assets/js/i18n.js?v=202610201934"></script>
<script src="assets/js/data.js?v=202610201934"></script>
<script src="assets/js/explain.js?v=202610201934"></script>
<script src="assets/js/tour.js?v=202610201934"></script>
<script src="assets/js/app.js?v=202610201934"></script>
</body>
</html>
